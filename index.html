<script>

const defDim=()=>innerWidth>=900?[1000,563]:innerWidth<600?[563,1000]:[750,1000];let doc={strokes:[],bg:'#ffffff',w:defDim()[0],h:defDim()[1]},undo=[],redo=[],T=0,D=1,sc=1,view={z:1,x:0,y:0},busy=false,cancel=false;

function cells(s,g){const k=s.pts.length+'_'+g,e=CC.get(s);if(e&&e.k===k)return e.v;const M=new Map(),b=s.brush;let o=0,px=null;
 const add=(x,y)=>{const cx=Math.floor(x/g),cy=Math.floor(y/g);o++;const F=b==='pxline'?[[0,0]]:b==='pxspray'?[...Array(5)].map((_,j)=>[Math.round((rnd(s.seed+o*7+j)-.5)*5),Math.round((rnd(s.seed+o*3+j+.5)-.5)*5)]):[-1,0,1].flatMap(i=>[-1,0,1].map(j=>[i,j]));
